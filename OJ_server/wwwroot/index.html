<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feng-Bit OJ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>

        /* 主内容区 */
        .hero {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
            text-align: center;
        }

        .hero__title {
            font-size: 3rem;
            color: var(--primary-accent);
            margin-bottom: 1.5rem;
        }

        .hero__desc {
            color: var(--primary-dark);
            font-size: 1.25rem;
            margin-bottom: 2.5rem;
            line-height: 1.8;
        }

        [data-theme="dark"] .hero__desc {
            color: var(--dark-text);
        }

        /* CTA按钮 */
        .cta {
            display: inline-flex;
            padding: 1rem 2.5rem;
            background: var(--success);
            color: white;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(76, 175, 130, 0.2);
        }

        .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(76, 175, 130, 0.3);
        }


        /* 响应式设计 */
        @media (max-width: 768px) {
            .hero__title {
                font-size: 2.25rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/all_questions" class="nav-link">题库</a>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-sun"></i>
            </button>
        </div>
    </nav>

    <main class="hero">
        <h1 class="hero__title">欢迎来到Feng-Bit OJ</h1>
        <p class="hero__desc">基于现代Web技术构建的编程评测平台，提供优雅的代码编辑体验和实时评测功能，助您提升算法能力。</p>
        <a href="/all_questions" class="cta">开始挑战 →</a>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
